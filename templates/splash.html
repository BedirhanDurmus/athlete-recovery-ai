<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Athlete Recovery AI — Hazırlanıyor</title>
  <!-- Ön yükleme: görseller daha erken gelsin -->
  <link rel="preload" as="image" href="{{ url_for('static', filename='images/splash-athletics.jpg') }}" fetchpriority="high">
  <link rel="preload" as="image" href="{{ url_for('static', filename='images/splash-basketball.jpg') }}">
  <link rel="preload" as="image" href="{{ url_for('static', filename='images/splash-boxing.jpg') }}">
  <link rel="preload" as="image" href="{{ url_for('static', filename='images/splash-fitness.jpg') }}">
  <link rel="preload" as="image" href="{{ url_for('static', filename='images/splash-soccer.jpg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/splash.css') }}?v=4">
</head>
<body>

<div class="splash">

  <div class="splash-visual" id="splash-visual">
    <div class="slides is-pending" id="slides-root" aria-hidden="true">
      <img class="slide active" src="{{ url_for('static', filename='images/splash-athletics.jpg') }}" alt="" width="1400" height="788" fetchpriority="high" decoding="async">
      <img class="slide" src="{{ url_for('static', filename='images/splash-basketball.jpg') }}" alt="" width="1400" height="788" decoding="async">
      <img class="slide" src="{{ url_for('static', filename='images/splash-boxing.jpg') }}" alt="" width="1400" height="788" decoding="async">
      <img class="slide" src="{{ url_for('static', filename='images/splash-fitness.jpg') }}" alt="" width="1400" height="788" decoding="async">
      <img class="slide" src="{{ url_for('static', filename='images/splash-soccer.jpg') }}" alt="" width="1400" height="788" decoding="async">
    </div>
    <div class="overlay"></div>
  </div>

  <div class="particles" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="content">

    <div class="logo-wrap">
      <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="30" stroke="url(#g1)" stroke-width="2.5"/>
        <path d="M16 44 L32 12 L48 44" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 36 H42" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#10b981"/>
          </linearGradient>
        </defs>
      </svg>
      <h1 class="brand">ATHLETE RECOVERY <span class="ai-badge">AI</span></h1>
      <p class="tagline">AI destekli sporcu toparlanma analizi ve performans tahmini</p>
    </div>

    <div class="progress-block">
      <div class="progress-label">
        <span class="status-wrap"><span id="status-text"></span><span class="type-cursor" id="type-cursor" aria-hidden="true">▍</span></span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <button id="start-btn" class="start-btn" disabled type="button">
      <span class="btn-icon">▶</span>
      <span class="btn-text">BAŞLA</span>
    </button>

    <div class="stats">
      <div class="stat"><div class="stat-num">300</div><div class="stat-label">Atlet</div></div>
      <div class="stat"><div class="stat-num">28</div><div class="stat-label">Gün</div></div>
      <div class="stat"><div class="stat-num">21</div><div class="stat-label">Özellik</div></div>
      <div class="stat"><div class="stat-num">0-100</div><div class="stat-label">Skor</div></div>
    </div>

  </div>

</div>

<script src="{{ url_for('static', filename='js/splash.js') }}?v=4"></script>
</body>
</html>
