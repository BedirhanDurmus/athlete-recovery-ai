<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Athlete Recovery AI — Hazırlanıyor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/splash.css') }}">
</head>
<body>

<div class="splash">

  <div class="slides" aria-hidden="true">
    <div class="slide active">
      <img class="slide-img" src="{{ url_for('static', filename='images/splash-athletics.jpg') }}" alt="" decoding="async" fetchpriority="high">
    </div>
    <div class="slide">
      <img class="slide-img" src="{{ url_for('static', filename='images/splash-basketball.jpg') }}" alt="" decoding="async">
    </div>
    <div class="slide">
      <img class="slide-img" src="{{ url_for('static', filename='images/splash-boxing.jpg') }}" alt="" decoding="async">
    </div>
    <div class="slide">
      <img class="slide-img" src="{{ url_for('static', filename='images/splash-fitness.jpg') }}" alt="" decoding="async">
    </div>
    <div class="slide">
      <img class="slide-img" src="{{ url_for('static', filename='images/splash-soccer.jpg') }}" alt="" decoding="async">
    </div>
  </div>

  <div class="overlay"></div>

  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="hud">
    <p class="status-line" id="status-line" aria-live="polite"></p>
    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-percent" id="progress-percent">0%</span>
    </div>
    <button type="button" id="start-btn" class="start-btn" disabled>
      <span class="btn-icon">▶</span>
      <span class="btn-text">BAŞLA</span>
    </button>
  </div>

</div>

<script src="{{ url_for('static', filename='js/splash.js') }}"></script>
</body>
</html>
